services:
  postgres:
    image: postgres:16-alpine
    container_name: product-catalogue-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_device_types.sql:/docker-entrypoint-initdb.d/002_device_types.sql:ro
      - ./database/003_catalogue_view.sql:/docker-entrypoint-initdb.d/003_catalogue_view.sql:ro
      - ./database/004_readonly_user.sql:/docker-entrypoint-initdb.d/004_readonly_user.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
